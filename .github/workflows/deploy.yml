name: Deploy to Home Lab

on:
  push:
    branches:
      - main # Triggers the action when code is pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Execute Remote Deployment via Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          CF_HOSTNAME: ${{ secrets.CF_HOSTNAME }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          SERVICE_CONFIG_JSON: ${{ secrets.SERVICE_CONFIG_JSON }}
        run: |
          # 1. Set up the SSH directory and inject the Runner Key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 2. Materialize the service config only on the runner, then copy it
          # directly to the ignored deployment path without printing it.
          test -n "$SERVICE_CONFIG_JSON"
          umask 077
          printf '%s' "$SERVICE_CONFIG_JSON" > /tmp/service-config.json
          scp -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h --service-token-id $CF_CLIENT_ID --service-token-secret $CF_CLIENT_SECRET" -i ~/.ssh/id_ed25519 /tmp/service-config.json "$SERVER_USER@$CF_HOSTNAME:/home/tav/takesAVillage/service/config.json"

          # 3. Connect and execute the validated production-profile rebuild.
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h --service-token-id $CF_CLIENT_ID --service-token-secret $CF_CLIENT_SECRET" -i ~/.ssh/id_ed25519 $SERVER_USER@$CF_HOSTNAME << 'EOF'
            set -eu

            cd /home/tav/takesAVillage
            GIT_SSH_COMMAND="ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" git pull origin main
            chmod 600 service/config.json
            node scripts/compose.mjs production up -d --build
            docker image prune -f
          EOF
          rm -f /tmp/service-config.json
