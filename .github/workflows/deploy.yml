name: Deploy to Home Lab

on:
  push:
    branches:
      - main # Triggers the action when code is pushed to the main branch

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt 
          pip install pytest pytest-mock
          
      - name: Run Pytest
        run: |
          pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Execute Remote Deployment via Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          CF_HOSTNAME: ${{ secrets.CF_HOSTNAME }}
        run: |
          # 1. Set up the SSH directory and private key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # 2. Connect and execute the Docker Compose rebuild
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" -i ~/.ssh/id_ed25519 $SERVER_USER@$CF_HOSTNAME << 'EOF'
            set -x
          
            cd /home/dj/takesAVillage
            
            # Pull any new changes securely using the deploy key
            GIT_SSH_COMMAND="ssh -i ~/.ssh/homelab_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" git pull origin main
            
            # Rebuild and restart the frontend and backend containers
            docker compose up -d --build frontend backend
            
            # Clean up old unused images to save disk space
            docker image prune -f
          EOF
