server {
    # Listen on standard HTTP port and redirect to HTTPS
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    # Listen on HTTPS port
    listen 443 ssl;
    server_name localhost;

    # Point to the certificates we will mount in Docker
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Route normal web traffic to Flask
    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CRITICAL: Route WebSocket traffic for Flask-SocketIO
  location /socket.io/ {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        
        # These two headers are required to keep the WebSocket alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
