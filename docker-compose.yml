services:
  db:
    image: mysql:8.0
    container_name: village_db
    restart: always
    environment:
      # These must match what your app expects
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: village_db
      MYSQL_USER: village
      MYSQL_PASSWORD: village_db
    ports:
      - "5001:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: village_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      # These variables get picked up by the new load_config() in db.py
      - DB_HOST=db
      - DB_USER=village
      - DB_PASSWORD=village_db
      - DB_NAME=village_db
    depends_on:
      - db

volumes:
  db_data:
