services:
  db:
    image: mysql:8.0
    container_name: village_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=village_db
      - MYSQL_USER=village
      - MYSQL_PASSWORD=village_db
    ports:
      - "3307:3306" 
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "village", "-pvillage_db"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s 

  web:
    build: .
    container_name: village_web
    restart: always
    ports:
      - "5000:5000"  # <-- Changed from 'expose' to 'ports' to open it to your host
    environment:
      - DB_HOST=db
      - DB_USER=village
      - DB_PASSWORD=village_db
      - DB_NAME=village_db
    volumes:
      - ./service:/app/service
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
