services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    ports:
      - "${HOST_DATABASE_PORT:-3308}:3306"
    configs:
      - source: service_config
        target: /run/config/service.json
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$(jq -r '.database.rootPassword' /run/config/service.json)\""]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "${HOST_SERVICE_PORT:-5000}:5000"
    environment:
      SERVICE_CONFIG_PATH: /app/config/service.json
      PORT: "5000"
    configs:
      - source: service_config
        target: /app/config/service.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bots:
    build:
      context: .
      dockerfile: Dockerfile.bots
    restart: unless-stopped
    ports:
      - "${HOST_BOTS_PORT:-8001}:8001"
    environment:
      SERVICE_CONFIG_PATH: /app/config/service.json
    configs:
      - source: service_config
        target: /app/config/service.json
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/models')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HOST_FRONTEND_PORT:-4999}:4999"
    configs:
      - source: frontend_config
        target: /app/frontend/dist/config.json
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4999/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

configs:
  service_config:
    file: ./service/config.json
  frontend_config:
    file: ./frontend/config.json

volumes:
  db_data: