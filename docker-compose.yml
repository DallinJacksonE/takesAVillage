services:
  db:
    image: mysql:8.0
    container_name: village_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=village_db
      - MYSQL_USER=village
      - MYSQL_PASSWORD=village_db
    ports:
      - "${PROD_DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "village", "-pvillage_db" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: village_backend
    restart: always
    ports:
      - "${PROD_BACKEND_PORT:-5000}:5000"
    environment:
      PYTHONUNBUFFERED: 1
      DB_TYPE: mysql
      DB_HOST: db
      DB_USER: village
      DB_PASSWORD: village_db
      DB_NAME: village_db
      BOT_SECRET: ${BOT_SECRET:?Set BOT_SECRET in the environment or .env file}
      BOT_SERVICE_URL: http://bots:8001
    volumes:
      - ./service:/app/service
      - ./logs:/app/logs
    # If DB_TYPE=memory, it won't crash if the DB container isn't up, 
    # but depends_on is still good practice for when you switch back.
    depends_on:
      db:
        condition: service_healthy

  bots:
    build:
      context: .
      dockerfile: Dockerfile.bots
    container_name: village_bots
    restart: always
    ports:
      - "${PROD_BOTS_PORT:-8001}:8001"
    environment:
      # Use the docker-compose service name 'backend' to route traffic
      - GAME_SERVER_HTTP_URL=http://backend:5000
      - GAME_SERVER_WS_URL=ws://backend:5000/ws
      - BOT_SECRET=${BOT_SECRET:?Set BOT_SECRET in the environment or .env file}
    volumes:
      - ./bots:/app/bots
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: village_frontend
    restart: always
    ports:
      - "${PROD_FRONTEND_PORT:-4999}:4999"
    depends_on:
      - backend

volumes:
  db_data:
